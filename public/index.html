<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlowForge</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">
                <div class="logo-icon"></div>
                <h1>FlowForge</h1>
            </div>
            <nav>
                <button class="nav-btn active" data-view="editor">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
                    Editor
                </button>
                <button class="nav-btn" data-view="execution">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                    Live Execution
                </button>
                <button class="nav-btn" data-view="history">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                    History
                </button>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            
            <!-- View: Editor -->
            <section id="view-editor" class="view active">
                <header class="view-header">
                    <h2>Workflow Editor</h2>
                    <div class="header-actions">
                        <select id="example-select" class="glass-select">
                            <option value="">Load Example...</option>
                            <option value="basic-pipeline">Basic CI Pipeline</option>
                            <option value="parallel-build">Parallel Build</option>
                            <option value="conditional-deploy">Conditional Deploy</option>
                        </select>
                        <button id="btn-validate" class="btn btn-secondary">Validate</button>
                        <button id="btn-execute" class="btn btn-primary">Execute Workflow</button>
                    </div>
                </header>
                <div class="editor-container">
                    <textarea id="json-editor" spellcheck="false" placeholder="Paste your workflow JSON here..."></textarea>
                    <div id="validation-errors" class="validation-errors hidden"></div>
                </div>
            </section>

            <!-- View: Execution -->
            <section id="view-execution" class="view">
                <header class="view-header">
                    <h2>Live Execution <span id="exec-status-badge" class="badge">Idle</span></h2>
                    <div id="exec-timer" class="timer">00:00</div>
                </header>
                
                <div class="execution-layout">
                    <!-- DAG Canvas -->
                    <div class="dag-panel glass-panel">
                        <h3>Dependency Graph</h3>
                        <div class="canvas-container">
                            <canvas id="dag-canvas"></canvas>
                        </div>
                    </div>
                    
                    <!-- Logs -->
                    <div class="logs-panel glass-panel">
                        <h3>Live Logs</h3>
                        <div id="logs-container" class="logs-container">
                            <div class="log-placeholder">Waiting for execution to start...</div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- View: History -->
            <section id="view-history" class="view">
                <header class="view-header">
                    <h2>Execution History</h2>
                    <button id="btn-refresh-history" class="btn btn-secondary">Refresh</button>
                </header>
                <div class="history-panel glass-panel">
                    <table class="history-table">
                        <thead>
                            <tr>
                                <th>Execution ID</th>
                                <th>Workflow</th>
                                <th>Status</th>
                                <th>Start Time</th>
                                <th>Duration</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="history-tbody">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </section>

        </main>
    </div>
    
    <script src="app.js"></script>
</body>
</html>
